name: Media helper

# The admin app drops small request files into requests/ to get an Instagram picture
# or a copy of a video (for the frame picker). See scripts/media-helper.mjs.
on:
  push:
    branches: [main]
    paths: ["requests/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: media-helper
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      # the runner already has Node; yt-dlp is only needed for video copies (frame picker)
      - uses: actions/checkout@v4
      # pinned on purpose (this job can write to the repo) — bump the version when downloads break
      - name: Install yt-dlp
        run: |
          if grep -qs '"kind": *"video"' requests/*.json; then python3 -m pip install --quiet "yt-dlp==2026.8.19"; fi
      - name: Load recent results
        run: |
          if git ls-remote --exit-code --heads origin media-cache >/dev/null; then
            git clone --quiet --depth 1 --branch media-cache "$REPO_URL" out-old
          fi
      - name: Handle requests
        run: node scripts/media-helper.mjs
      # publish results first — that's what the app is waiting for
      - name: Publish results to the media-cache branch
        run: |
          cd out
          git init -q
          git checkout -q -b media-cache
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Media cache" --allow-empty
          git push -q -f "$REPO_URL" media-cache
      - name: Clear handled requests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A requests 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Media helper: handle requests"
            git pull -q --rebase origin main
            git push -q
          fi
