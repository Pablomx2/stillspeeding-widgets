name: Video covers

# After the admin app publishes the video list, fetch the highest-quality cover picture
# (via yt-dlp) for any YouTube, Vimeo or Instagram item that doesn't have one yet.
on:
  push:
    branches: [main]
    paths: [data/videos.json]
  workflow_dispatch:
    inputs:
      test_url:
        description: "YouTube, Vimeo or Instagram link to test (dry run — nothing is saved)"
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: video-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python3 -m pip install --quiet --upgrade yt-dlp
      - name: Fetch missing covers
        run: node scripts/video-covers.mjs
        env:
          TEST_URL: ${{ inputs.test_url }}
      # (pushes made here don't start the Cover sizes workflow, so make the small copies now)
      - name: Make cover sizes
        if: ${{ !inputs.test_url }}
        run: |
          npm install --no-save --no-package-lock --silent sharp@0.35.5
          node scripts/cover-sizes.mjs
      - name: Save covers
        if: ${{ !inputs.test_url }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard covers)" ]; then
            echo "No new covers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A covers data/videos.json
          git commit -m "Add video covers"
          git pull --rebase origin main
          git push
          # pushes made by Actions don't redeploy the site on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
